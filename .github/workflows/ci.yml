name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm exec prettier --check .
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm check-types
      - name: Unit tests
        run: pnpm test
      - name: Dependency audit (production, high and critical)
        run: pnpm audit --prod --audit-level high
      - name: Build
        run: pnpm build
